
name: Deploy static content to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:

  # JOB 1: Prepare and upload artifact
  build:
    name: Build and Upload Pages Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      - name: Verify repository contents
        run: |
          echo "Current working directory:"
          pwd
          echo "Repository contents:"
          ls -lah

      - name: Upload GitHub Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages
          path: '.'
          retention-days: 2

      - name: Verify uploaded artifact
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          echo "Artifact name: github-pages"
          echo "Artifact ID: $ARTIFACT_ID"

          if [ -z "$ARTIFACT_ID" ]; then
            echo "ERROR: Artifact upload ID is missing"
            exit 1
          fi

  # JOB 2: Deploy uploaded artifact
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Wait for artifact availability
        run: |
          echo "Waiting for artifact metadata propagation..."
          sleep 20

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: github-pages

      - name: GitHub Pages URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "# GitHub Pages Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "[View Your Demo Template Page!]($PAGE_URL)" >> "$GITHUB_STEP_SUMMARY"
